name: harvest

# Daily harvest for the Garmin Coach dashboard, wanted at about 06:00 Copenhagen time.
# GitHub schedules in UTC only and sometimes delays or drops scheduled runs, so there are
# four ticks between 04:13 and 05:43 UTC (05:13-07:43 Copenhagen depending on summer/winter time).
# The "fresh" gate lets a scheduled tick run only when the data is older than 3 hours,
# so normally only the first tick that actually fires does the work and the others skip.
# Manual runs (workflow_dispatch) always go through.
on:
  schedule:
    - cron: "13 4 * * *"
    - cron: "43 4 * * *"
    - cron: "13 5 * * *"
    - cron: "43 5 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    if: github.repository == 'schibra/rss-feeds-harvester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only to commit data/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Skip scheduled ticks when the data is already fresh
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/news.json ]; then
            age=$(python3 -c "import json,datetime as d; g=json.load(open('data/news.json'))['generated']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g)).total_seconds()))")
            echo "event: schedule, data age: ${age}s"
            if [ "$age" -lt 10800 ]; then run=false; fi
          else
            echo "event: ${{ github.event_name }}"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Fetch feeds and forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          python harvest.py
          python front.py wire
      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "news-harvest"
            git config user.email "news-harvest@users.noreply.github.com"
            git add data/
            git commit -m "harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
