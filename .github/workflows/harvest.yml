name: harvest

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python harvest.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "news-harvest"
            git config user.email "news-harvest@users.noreply.github.com"
            git add data/news.json
            git commit -m "harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
