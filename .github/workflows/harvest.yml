name: harvest

# Runs once a day at about 06:00 Copenhagen time (minute 3, as GitHub is slowest at the top of the hour). GitHub schedules in UTC only, and
# Copenhagen is UTC+1 in winter and UTC+2 in summer, so two UTC slots are listed
# and the "gate" step lets through only the one that falls in the 06:xx hour there.
on:
  schedule:
    - cron: "3 4 * * *"    # 06:03 in summer (CEST)
    - cron: "3 5 * * *"    # 06:03 in winter (CET)
  workflow_dispatch: {}    # manual runs always go through

permissions: {}

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    if: github.repository == 'schibra/rss-feeds-harvester'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only to commit data/
    steps:
      - name: Gate on Copenhagen local time
        id: gate
        run: |
          hour=$(TZ=Europe/Copenhagen date +%H)
          echo "Copenhagen hour: $hour, event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Fetch feeds
        if: steps.gate.outputs.run == 'true'
        run: |
          python harvest.py
          python front.py wire
      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "news-harvest"
            git config user.email "news-harvest@users.noreply.github.com"
            git add data/
            git commit -m "harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
